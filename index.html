<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>畇朵家飾 雲端報價系統</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-area { border: none !important; box-shadow: none !important; margin: 0 !important; width: 100% !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby85W4jwh67qbZHOifLiRrkYjk96BD2YeUdFv-AXSGgXZWLKH2teiXZxc6eHWsV35jUfw/exec";

    const DEFAULT_QUOTES = [
      {
        id: '1',
        projectName: '裕信路',
        phone: '0912-345-678',
        address: '臺南市東區裕信路',
        quoteDate: '115/11/06',
        paymentMethod: '現金/匯款/即期支票',
        salesRep: 'Bella',
        items: [
          { id: '101', floor: '一樓', space: '客廳', name: '100%物理遮光素色布', type: '無縫布', width: 7, height: 8.4, qty: 1, price: 360 },
          { id: '102', floor: '一樓', space: '客廳', name: '鋁合金M6手撥軌道', type: '軌道', width: 7, height: 0, qty: 1, price: 70 },
          { id: '103', floor: '二樓', space: '主臥', name: '高空梯安裝費用', type: '安裝費用', width: 0, height: 0, qty: 1, price: 3500 },
        ],
        customDiscountedTotal: '',
        salesSignature: ''
      }
    ];

    function App() {
      const [quotes, setQuotes] = useState(() => {
        const saved = localStorage.getItem('yunduo_all_quotes');
        return saved ? JSON.parse(saved) : DEFAULT_QUOTES;
      });

      const [currentId, setCurrentId] = useState(() => {
        return quotes.length > 0 ? quotes[0].id : '1';
      });

      const [syncing, setSyncing] = useState(false);

      useEffect(() => {
        localStorage.setItem('yunduo_all_quotes', JSON.stringify(quotes));
      }, [quotes]);

      const quote = quotes.find(q => q.id === currentId) || quotes[0];

      const updateCurrentQuote = (updatedFields) => {
        setQuotes(quotes.map(q => q.id === currentId ? { ...q, ...updatedFields } : q));
      };

      // 智慧計算單一品項金額
      const calculateItemAmount = (item) => {
        const w = Number(item.width) || 0;
        const h = Number(item.height) || 0;
        const q = Number(item.qty) || 1;
        const p = Number(item.price) || 0;
        const ceilW = Math.ceil(w);
        const ceilH = Math.ceil(h);

        if (item.type === '軌道') {
          return ceilW * p;
        } else if (item.type === '捲簾/百葉類') {
          const cals = Math.max(1, ceilW) * Math.max(1, ceilH);
          return cals * p;
        } else if (item.type === '無縫布' || item.type === '無縫紗') {
          let base = ceilW * 2 * p;
          if (h > 9) base *= 2;
          return base;
        } else if (item.type === '五尺布' || item.type === '五尺紗') {
          let base = (ceilW + 1) * 2 * (p * 2);
          if (h > 9) base *= 2;
          return base;
        } else if (item.type === '電機費用' || item.type === '安裝費用') {
          // 單位 × 單價
          return q * p;
        } else {
          return ceilW * p;
        }
      };

      const calculateSubtotal = () => quote.items.reduce((sum, item) => sum + calculateItemAmount(item), 0);
      const totalAmount = quote.customDiscountedTotal !== '' ? Number(quote.customDiscountedTotal) : calculateSubtotal();
      const depositAmount = Math.round(totalAmount * 0.5);

      const handleItemChange = (itemId, field, value) => {
        const newItems = quote.items.map(item => item.id === itemId ? { ...item, [field]: value } : item);
        updateCurrentQuote({ items: newItems });
      };

      const addItem = () => {
        const newItems = [...quote.items, { id: Date.now().toString(), floor: '一樓', space: '客廳', name: '新窗簾品項', type: '無縫布', width: 6, height: 8, qty: 1, price: 360 }];
        updateCurrentQuote({ items: newItems });
      };

      const removeItem = (itemId) => {
        const newItems = quote.items.filter(item => item.id !== itemId);
        updateCurrentQuote({ items: newItems });
      };

      const addNewQuoteFile = () => {
        const newId = Date.now().toString();
        const newFile = {
          id: newId,
          projectName: '新客戶案名',
          phone: '',
          address: '',
          quoteDate: new Date().toLocaleDateString('zh-TW', {year: 'numeric', month: '2-digit', day: '2-digit'}).replace(/\//g, '/'),
          paymentMethod: '現金/匯款/即期支票',
          salesRep: 'Bella',
          items: [{ id: Date.now() + 1, floor: '一樓', space: '客廳', name: '遮光布', type: '無縫布', width: 6, height: 8, qty: 1, price: 360 }],
          customDiscountedTotal: '',
          salesSignature: ''
        };
        setQuotes([...quotes, newFile]);
        setCurrentId(newId);
      };

      const deleteCurrentQuote = () => {
        if (quotes.length <= 1) {
          alert('至少需保留一個檔案！');
          return;
        }
        if (confirm(`確定要刪除「${quote.projectName}」的報價單嗎？`)) {
          const remaining = quotes.filter(q => q.id !== currentId);
          setQuotes(remaining);
          setCurrentId(remaining[0].id);
        }
      };

      const exportCSV = () => {
        let csvContent = "\uFEFF案名,聯絡電話,地址,報價日期,業務,總金額,50%訂金\n";
        csvContent += `"${quote.projectName}","${quote.phone}","${quote.address}","${quote.quoteDate}","${quote.salesRep}",${totalAmount},${depositAmount}\n\n`;
        csvContent += "樓層,空間,品名,寬(尺),高(尺),單位,單價,小計\n";
        quote.items.forEach(item => {
          csvContent += `"${item.floor}","${item.space}","${item.name}",${item.width},${item.height},${item.qty},${item.price},${calculateItemAmount(item)}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `畇朵報價單_${quote.projectName}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const syncToCloud = () => {
        setSyncing(true);
        const payload = {
          projectName: quote.projectName,
          phone: quote.phone,
          address: quote.address,
          quoteDate: quote.quoteDate,
          salesRep: quote.salesRep,
          totalAmount: totalAmount,
          depositAmount: depositAmount
        };

        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(() => {
          setSyncing(false);
          alert(`🎉 成功將「${quote.projectName}」的報價資料同步上傳至 Google 雲端試算表！`);
        })
        .catch(err => {
          setSyncing(false);
          console.error(err);
          alert("同步時發生錯誤，請稍後重試。");
        });
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          {/* 檔案管理與控制按鈕區 */}
          <div className="no-print mb-6 bg-white p-4 rounded-xl shadow-sm border border-amber-100 space-y-3">
            <div className="flex flex-wrap justify-between items-center gap-3">
              <div className="flex items-center gap-2">
                <span className="font-bold text-amber-900 text-sm">📁 切換案名：</span>
                <select 
                  value={currentId} 
                  onChange={e => setCurrentId(e.target.value)}
                  className="border border-amber-300 rounded-lg px-3 py-1.5 font-medium bg-amber-50 text-amber-950 focus:outline-none"
                >
                  {quotes.map(q => (
                    <option key={q.id} value={q.id}>{q.projectName} ({q.quoteDate})</option>
                  ))}
                </select>
                <button onClick={addNewQuoteFile} className="bg-amber-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-amber-700 shadow">
                  ＋ 新增案子
                </button>
                <button onClick={deleteCurrentQuote} className="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-rose-200">
                  🗑️ 刪除
                </button>
              </div>

              <div className="flex flex-wrap gap-2">
                <button onClick={syncToCloud} disabled={syncing} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 shadow text-sm">
                  {syncing ? '🔄 同步中...' : '☁️ 同步至雲端試算表'}
                </button>
                <button onClick={exportCSV} className="bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium hover:bg-emerald-800 shadow text-sm">
                  📥 匯出 Excel
                </button>
                <button onClick={addItem} className="bg-amber-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-amber-700 shadow text-sm">
                  ➕ 新增品項
                </button>
                <button onClick={() => window.print()} className="bg-amber-800 text-white px-5 py-2 rounded-lg font-medium hover:bg-amber-900 shadow text-sm">
                  🖨️ 列印 / PDF
                </button>
              </div>
            </div>
          </div>

          {/* 報價單 A4 主體 */}
          <div className="print-area bg-white p-8 rounded-lg shadow-lg border border-gray-200">
            <h2 className="text-2xl font-bold text-center tracking-widest mb-6 pb-2 border-b-2 border-amber-800 text-amber-950">
              畇朵報價單
            </h2>

            {/* 客戶基本資料 */}
            <div className="grid grid-cols-2 gap-4 mb-6 text-sm">
              <div className="space-y-2">
                <p><span className="font-bold text-gray-700">案名：</span>
                  <input value={quote.projectName} onChange={e => updateCurrentQuote({ projectName: e.target.value })} className="no-print border-b px-1 w-48 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.projectName}</span>
                </p>
                <p><span className="font-bold text-gray-700">聯絡電話：</span>
                  <input value={quote.phone} onChange={e => updateCurrentQuote({ phone: e.target.value })} className="no-print border-b px-1 w-48 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.phone}</span>
                </p>
                <p><span className="font-bold text-gray-700">地址：</span>
                  <input value={quote.address} onChange={e => updateCurrentQuote({ address: e.target.value })} className="no-print border-b px-1 w-64 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.address}</span>
                </p>
              </div>
              <div className="space-y-2">
                <p><span className="font-bold text-gray-700">報價日期：</span>
                  <input value={quote.quoteDate} onChange={e => updateCurrentQuote({ quoteDate: e.target.value })} className="no-print border-b px-1 w-36 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.quoteDate}</span>
                </p>
                <p><span className="font-bold text-gray-700">付款方式：</span>{quote.paymentMethod}</p>
                <p><span className="font-bold text-gray-700">承辦業務：</span>
                  <input value={quote.salesRep} onChange={e => updateCurrentQuote({ salesRep: e.target.value })} className="no-print border-b px-1 w-36 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.salesRep}</span>
                </p>
              </div>
            </div>

            {/* 品項明細表格 */}
            <table className="w-full border-collapse border border-gray-400 mb-6 text-sm">
              <thead>
                <tr style={{ backgroundColor: '#c8b284' }} className="text-gray-900 font-bold">
                  <th className="border border-gray-400 p-2 w-20">樓層</th>
                  <th className="border border-gray-400 p-2 w-20">空間</th>
                  <th className="border border-gray-400 p-2 w-1/4">品名</th>
                  <th className="border border-gray-400 p-2 text-center w-14">寬</th>
                  <th className="border border-gray-400 p-2 text-center w-14">高</th>
                  <th className="border border-gray-400 p-2 text-center w-14">單位</th>
                  <th className="border border-gray-400 p-2 text-right w-16">單價</th>
                  <th className="border border-gray-400 p-2 text-right">金額</th>
                  <th className="border border-gray-400 p-1 w-10 no-print">動作</th>
                </tr>
              </thead>
              <tbody>
                {quote.items.map((item) => {
                  const isNoWidthHeight = item.type === '電機費用' || item.type === '安裝費用';
                  const isTrack = item.type === '軌道';
                  return (
                    <tr key={item.id} className="hover:bg-amber-50/30">
                      {/* 樓層 */}
                      <td className="border border-gray-400 p-1">
                        <select 
                          value={item.floor} 
                          onChange={e => handleItemChange(item.id, 'floor', e.target.value)}
                          className="w-full no-print bg-transparent font-medium text-gray-900 focus:outline-none text-xs"
                        >
                          <option value="無樓層">無樓層</option>
                          <option value="一樓">一樓</option>
                          <option value="二樓">二樓</option>
                          <option value="三樓">三樓</option>
                          <option value="四樓">四樓</option>
                          <option value="五樓">五樓</option>
                        </select>
                        <span className="hidden print:inline text-xs">{item.floor}</span>
                      </td>

                      {/* 空間 */}
                      <td className="border border-gray-400 p-1">
                        <select 
                          value={item.space} 
                          onChange={e => handleItemChange(item.id, 'space', e.target.value)}
                          className="w-full no-print bg-transparent font-medium text-gray-900 focus:outline-none text-xs"
                        >
                          <option value="客廳">客廳</option>
                          <option value="餐廳">餐廳</option>
                          <option value="廚房">廚房</option>
                          <option value="主臥">主臥</option>
                          <option value="房間">房間</option>
                          <option value="書房">書房</option>
                          <option value="孝親房">孝親房</option>
                          <option value="女兒房">女兒房</option>
                          <option value="兒子房">兒子房</option>
                        </select>
                        <span className="hidden print:inline text-xs">{item.space}</span>
                      </td>

                      {/* 品名與計算類型（計算類型於列印時隱藏） */}
                      <td className="border border-gray-400 p-2">
                        <input value={item.name} onChange={e => handleItemChange(item.id, 'name', e.target.value)} className="w-full no-print bg-transparent focus:outline-none font-medium" placeholder="品名" />
                        <select 
                          value={item.type} 
                          onChange={e => handleItemChange(item.id, 'type', e.target.value)}
                          className="w-full no-print bg-amber-50 text-amber-900 rounded px-1 mt-1 font-semibold focus:outline-none text-[11px]"
                        >
                          <option value="無縫布">無縫布/紗 (算式2)</option>
                          <option value="五尺布">五尺布/紗 (算式3)</option>
                          <option value="捲簾/百葉類">捲簾/百葉 (算式1)</option>
                          <option value="軌道">軌道 (僅寬×單價)</option>
                          <option value="電機費用">電機費用 (單位×單價)</option>
                          <option value="安裝費用">安裝費用 (單位×單價)</option>
                        </select>
                        <span className="hidden print:inline font-medium">{item.name}</span>
                      </td>

                      {/* 寬 */}
                      <td className="border border-gray-400 p-2 text-center">
                        {!isNoWidthHeight ? (
                          <>
                            <input type="number" step="0.1" value={item.width} onChange={e => handleItemChange(item.id, 'width', e.target.value)} className="w-14 text-center no-print bg-transparent focus:outline-none" />
                            <span className="hidden print:inline">{item.width}</span>
                          </>
                        ) : <span className="text-gray-300">-</span>}
                      </td>

                      {/* 高 */}
                      <td className="border border-gray-400 p-2 text-center">
                        {!isNoWidthHeight && !isTrack ? (
                          <>
                            <input type="number" step="0.1" value={item.height} onChange={e => handleItemChange(item.id, 'height', e.target.value)} className="w-14 text-center no-print bg-transparent focus:outline-none" />
                            <span className="hidden print:inline">{item.height}</span>
                          </>
                        ) : <span className="text-gray-300">-</span>}
                      </td>

                      {/* 單位 */}
                      <td className="border border-gray-400 p-2 text-center">
                        {isNoWidthHeight ? (
                          <>
                            <input type="number" value={item.qty || 1} onChange={e => handleItemChange(item.id, 'qty', e.target.value)} className="w-14 text-center no-print bg-amber-100 rounded focus:outline-none font-bold" />
                            <span className="hidden print:inline">{item.qty || 1}</span>
                          </>
                        ) : <span className="text-gray-300">-</span>}
                      </td>

                      {/* 單價 */}
                      <td className="border border-gray-400 p-2 text-right">
                        <input type="number" value={item.price} onChange={e => handleItemChange(item.id, 'price', e.target.value)} className="w-16 text-right no-print bg-transparent focus:outline-none" />
                        <span className="hidden print:inline">{Number(item.price).toLocaleString()}</span>
                      </td>

                      {/* 金額 */}
                      <td className="border border-gray-400 p-2 text-right font-medium">
                        {calculateItemAmount(item).toLocaleString()}
                      </td>

                      {/* 刪除動作 */}
                      <td className="border border-gray-400 p-1 text-center no-print">
                        <button onClick={() => removeItem(item.id)} className="text-red-500 hover:text-red-700 font-bold">✕</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>

            {/* 金額與條款 */}
            <div className="grid grid-cols-3 border border-gray-400 text-xs mb-6">
              <div className="col-span-2 p-3 border-r border-gray-400 bg-gray-50 leading-relaxed">
                <p className="font-bold text-sm mb-1 text-gray-900">為確保雙方權益及服務品質，相關合作條款如下：</p>
                <ol className="list-decimal list-inside space-y-1 text-gray-700">
                  <li>付款方式：僅提供現金、匯款或即期支票。</li>
                  <li>收款：訂單確認後，須回簽本報價單並支付訂金 50%，以利安排生產與施工時程，完工收 50%。</li>
                  <li>客製商品說明：本報價單所列項目皆為客製化訂製品，恕不接受退訂或更改。</li>
                  <li>所有權保留：於貨款未全數付清前，產品所有權仍歸本公司所有。</li>
                  <li>報價有效期限制：本報價單自開立日起有效 14 天。</li>
                </ol>
              </div>
              <div className="col-span-1 flex flex-col justify-between">
                <div className="flex justify-between p-3 border-b border-gray-400 font-bold bg-amber-100/50 text-sm">
                  <span>總計：</span>
                  <span>${calculateSubtotal().toLocaleString()}</span>
                </div>
                <div className="p-3 bg-amber-50 h-full flex flex-col justify-center">
                  <div className="flex justify-between items-center mb-1 font-bold text-amber-900 text-sm">
                    <span>優惠價含稅：</span>
                    <input type="number" value={quote.customDiscountedTotal} onChange={e => updateCurrentQuote({ customDiscountedTotal: e.target.value })} className="w-24 text-right border border-amber-300 rounded px-1 no-print font-bold text-amber-900" />
                    <span className="hidden print:inline">${totalAmount.toLocaleString()}</span>
                  </div>
                  <p className="text-xs font-semibold text-amber-800 text-right mt-2">
                    50% 訂金金額：${depositAmount.toLocaleString()}
                  </p>
                </div>
              </div>
            </div>

            {/* 匯款資訊與空白簽章區 */}
            <div className="pt-4 border-t-2 border-gray-400 text-sm flex justify-between items-end">
              <div className="space-y-1">
                <p className="font-bold text-base text-gray-900">103 新光銀行 - 新營分行</p>
                <p className="text-gray-700 font-medium">戶名：畇朵家飾布企業社 ｜ 帳號：0541-10-1004306</p>
                <p className="text-xs text-gray-500">（回傳付款帳號後五碼以利查詢，感謝您）</p>
              </div>
              <div className="flex gap-6 text-center text-gray-900 font-bold">
                <div className="border border-gray-300 p-4 rounded-lg bg-gray-50 min-w-[160px]">
                  <p className="mb-10 text-xs text-gray-500 font-normal">公司業務簽章</p>
                  <p className="text-base text-gray-300 font-normal">（請在此簽名）</p>
                </div>
                <div className="border border-gray-300 p-4 rounded-lg bg-gray-50 min-w-[160px]">
                  <p className="mb-10 text-xs text-gray-500 font-normal">客戶簽章</p>
                  <p className="text-base text-gray-300 font-normal">（請在此簽名）</p>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
