<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>畇朵家飾 雲端報價系統</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-area { border: none !important; box-shadow: none !important; margin: 0 !important; width: 100% !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_QUOTE = {
      projectName: '裕信路',
      phone: '0912-345-678',
      address: '臺南市東區裕信路',
      quoteDate: '115/11/06',
      paymentMethod: '現金/匯款/即期支票',
      salesRep: 'Bella',
      items: [
        { id: '1', category: '正面彎軌', name: '100%物理遮光素色布', qty: 66, price: 440 },
        { id: '2', category: '彎軌正面軌道', name: '緹花面無縫布', qty: 66, price: 440 },
        { id: '3', category: '房間', name: '壓花80%遮光布', qty: 12, price: 160 },
        { id: '4', category: '軌道', name: '鋁合金M6手撥軌道', qty: 5, price: 70 },
        { id: '5', category: '高空', name: '高空梯含安裝費用', qty: 1, price: 3500 },
        { id: '6', category: '', name: '免高空費用/同社區介紹', qty: 1, price: -3500 },
      ],
      customDiscountedTotal: 54000,
      salesSignature: 'Bella'
    };

    function App() {
      const [quote, setQuote] = useState(() => {
        const saved = localStorage.getItem('yunduo_current_quote');
        return saved ? JSON.parse(saved) : DEFAULT_QUOTE;
      });

      useEffect(() => {
        localStorage.setItem('yunduo_current_quote', JSON.stringify(quote));
      }, [quote]);

      const calculateSubtotal = () => quote.items.reduce((sum, item) => sum + (Number(item.qty || 0) * Number(item.price || 0)), 0);
      const totalAmount = quote.customDiscountedTotal !== '' ? Number(quote.customDiscountedTotal) : calculateSubtotal();

      const handleItemChange = (id, field, value) => {
        setQuote(prev => ({
          ...prev,
          items: prev.items.map(item => item.id === id ? { ...item, [field]: value } : item)
        }));
      };

      const addItem = () => {
        setQuote(prev => ({
          ...prev,
          items: [...prev.items, { id: Date.now().toString(), category: '', name: '', qty: 1, price: 0 }]
        }));
      };

      const removeItem = (id) => {
        setQuote(prev => ({ ...prev, items: prev.items.filter(item => item.id !== id) }));
      };

      const exportCSV = () => {
        let csvContent = "\uFEFF案名,聯絡電話,地址,報價日期,業務,總金額,50%訂金\n";
        csvContent += `"${quote.projectName}","${quote.phone}","${quote.address}","${quote.quoteDate}","${quote.salesRep}",${totalAmount},${Math.round(totalAmount*0.5)}\n\n`;
        csvContent += "項目,品名,數量,單價,小計\n";
        quote.items.forEach(item => {
          csvContent += `"${item.category}","${item.name}",${item.qty},${item.price},${Number(item.qty||0)*Number(item.price||0)}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `畇朵報價單_${quote.projectName}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          {/* 控制按鈕區 */}
          <div className="no-print mb-6 flex flex-wrap gap-3 justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-amber-100">
            <h1 className="text-xl font-bold text-amber-900 tracking-wide">畇朵家飾 雲端報價系統</h1>
            <div className="flex flex-wrap gap-2">
              <button onClick={exportCSV} className="bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium hover:bg-emerald-800 shadow text-sm">
                📥 匯出 Excel (CSV)
              </button>
              <button onClick={addItem} className="bg-amber-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-amber-700 shadow text-sm">
                ➕ 新增品項
              </button>
              <button onClick={() => window.print()} className="bg-amber-800 text-white px-5 py-2 rounded-lg font-medium hover:bg-amber-900 shadow text-sm">
                🖨️ 列印 / 另存 PDF
              </button>
            </div>
          </div>

          {/* 報價單 A4 主體 */}
          <div className="print-area bg-white p-8 rounded-lg shadow-lg border border-gray-200">
            <h2 className="text-2xl font-bold text-center tracking-widest mb-6 pb-2 border-b-2 border-amber-800 text-amber-950">
              畇朵報價單
            </h2>

            {/* 客戶基本資料 */}
            <div className="grid grid-cols-2 gap-4 mb-6 text-sm">
              <div className="space-y-2">
                <p><span className="font-bold text-gray-700">案名：</span>
                  <input value={quote.projectName} onChange={e => setQuote({...quote, projectName: e.target.value})} className="no-print border-b px-1 w-48 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.projectName}</span>
                </p>
                <p><span className="font-bold text-gray-700">聯絡電話：</span>
                  <input value={quote.phone} onChange={e => setQuote({...quote, phone: e.target.value})} className="no-print border-b px-1 w-48 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.phone}</span>
                </p>
                <p><span className="font-bold text-gray-700">地址：</span>
                  <input value={quote.address} onChange={e => setQuote({...quote, address: e.target.value})} className="no-print border-b px-1 w-64 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.address}</span>
                </p>
              </div>
              <div className="space-y-2">
                <p><span className="font-bold text-gray-700">報價日期：</span>
                  <input value={quote.quoteDate} onChange={e => setQuote({...quote, quoteDate: e.target.value})} className="no-print border-b px-1 w-36 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.quoteDate}</span>
                </p>
                <p><span className="font-bold text-gray-700">付款方式：</span>{quote.paymentMethod}</p>
                <p><span className="font-bold text-gray-700">承辦業務：</span>
                  <input value={quote.salesRep} onChange={e => setQuote({...quote, salesRep: e.target.value})} className="no-print border-b px-1 w-36 font-medium text-gray-900 focus:outline-none focus:border-amber-700" />
                  <span className="hidden print:inline">{quote.salesRep}</span>
                </p>
              </div>
            </div>

            {/* 品項明細表格 */}
            <table className="w-full border-collapse border border-gray-400 mb-6 text-sm">
              <thead>
                <tr style={{ backgroundColor: '#c8b284' }} className="text-gray-900 font-bold">
                  <th className="border border-gray-400 p-2 w-1/6">項目</th>
                  <th className="border border-gray-400 p-2 w-2/5">品名</th>
                  <th className="border border-gray-400 p-2 text-center">數量</th>
                  <th className="border border-gray-400 p-2 text-right">單價</th>
                  <th className="border border-gray-400 p-2 text-right">金額</th>
                  <th className="border border-gray-400 p-1 w-10 no-print">動作</th>
                </tr>
              </thead>
              <tbody>
                {quote.items.map((item) => (
                  <tr key={item.id} className="hover:bg-amber-50/30">
                    <td className="border border-gray-400 p-2">
                      <input value={item.category} onChange={e => handleItemChange(item.id, 'category', e.target.value)} className="w-full no-print bg-transparent focus:outline-none" />
                      <span className="hidden print:inline">{item.category}</span>
                    </td>
                    <td className="border border-gray-400 p-2">
                      <input value={item.name} onChange={e => handleItemChange(item.id, 'name', e.target.value)} className="w-full no-print bg-transparent focus:outline-none" />
                      <span className="hidden print:inline">{item.name}</span>
                    </td>
                    <td className="border border-gray-400 p-2 text-center">
                      <input type="number" value={item.qty} onChange={e => handleItemChange(item.id, 'qty', e.target.value)} className="w-16 text-center no-print bg-transparent focus:outline-none" />
                      <span className="hidden print:inline">{item.qty}</span>
                    </td>
                    <td className="border border-gray-400 p-2 text-right">
                      <input type="number" value={item.price} onChange={e => handleItemChange(item.id, 'price', e.target.value)} className="w-20 text-right no-print bg-transparent focus:outline-none" />
                      <span className="hidden print:inline">{Number(item.price).toLocaleString()}</span>
                    </td>
                    <td className="border border-gray-400 p-2 text-right font-medium">
                      {(Number(item.qty || 0) * Number(item.price || 0)).toLocaleString()}
                    </td>
                    <td className="border border-gray-400 p-1 text-center no-print">
                      <button onClick={() => removeItem(item.id)} className="text-red-500 hover:text-red-700 font-bold">✕</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

            {/* 金額與條款 */}
            <div className="grid grid-cols-3 border border-gray-400 text-xs mb-6">
              <div className="col-span-2 p-3 border-r border-gray-400 bg-gray-50 leading-relaxed">
                <p className="font-bold text-sm mb-1 text-gray-900">為確保雙方權益及服務品質，相關合作條款如下：</p>
                <ol className="list-decimal list-inside space-y-1 text-gray-700">
                  <li>付款方式：僅提供現金、匯款或即期支票。</li>
                  <li>收款：訂單確認後，須回簽本報價單並支付訂金 50%，以利安排生產與施工時程，完工收 50%。</li>
                  <li>客製商品說明：本報價單所列項目皆為客製化訂製品，恕不接受退訂或更改。</li>
                  <li>所有權保留：於貨款未全數付清前，產品所有權仍歸本公司所有。</li>
                  <li>報價有效期限制：本報價單自開立日起有效 14 天。</li>
                </ol>
              </div>
              <div className="col-span-1 flex flex-col justify-between">
                <div className="flex justify-between p-3 border-b border-gray-400 font-bold bg-amber-100/50 text-sm">
                  <span>總計：</span>
                  <span>${calculateSubtotal().toLocaleString()}</span>
                </div>
                <div className="p-3 bg-amber-50 h-full flex flex-col justify-center">
                  <div className="flex justify-between items-center mb-1 font-bold text-amber-900 text-sm">
                    <span>優惠價含稅：</span>
                    <input type="number" value={quote.customDiscountedTotal} onChange={e => setQuote({...quote, customDiscountedTotal: e.target.value})} className="w-24 text-right border border-amber-300 rounded px-1 no-print font-bold text-amber-900" />
                    <span className="hidden print:inline">${totalAmount.toLocaleString()}</span>
                  </div>
                  <p className="text-xs font-semibold text-amber-800 text-right mt-2">
                    50% 訂金金額：${Math.round(totalAmount * 0.5).toLocaleString()}
                  </p>
                </div>
              </div>
            </div>

            {/* 放大後的匯款資訊與簽章區 */}
            <div className="pt-4 border-t-2 border-gray-400 text-sm flex justify-between items-end">
              <div className="space-y-1">
                <p className="font-bold text-base text-gray-900">103 新光銀行 - 新營分行</p>
                <p className="text-gray-700 font-medium">戶名：畇朵家飾布企業社 ｜ 帳號：0541-10-1004306</p>
                <p className="text-xs text-gray-500">（回傳付款帳號後五碼以利查詢，感謝您）</p>
              </div>
              <div className="flex gap-6 text-center text-gray-900 font-bold">
                <div className="border border-gray-300 p-4 rounded-lg bg-gray-50 min-w-[160px]">
                  <p className="mb-10 text-xs text-gray-500 font-normal">公司業務簽章</p>
                  <p className="text-base tracking-widest border-b border-gray-400 pb-1">{quote.salesSignature}</p>
                </div>
                <div className="border border-gray-300 p-4 rounded-lg bg-gray-50 min-w-[160px]">
                  <p className="mb-10 text-xs text-gray-500 font-normal">客戶簽章</p>
                  <p className="text-base text-gray-300 font-normal">（請在此簽名）</p>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
