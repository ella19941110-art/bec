<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>畇朵家飾 雲端報價系統</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-area { border: none !important; box-shadow: none !important; margin: 0 !important; width: 100% !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_QUOTE = {
      projectName: '裕信路',
      phone: '0912-345-678',
      address: '臺南市東區裕信路',
      quoteDate: '115/11/06',
      paymentMethod: '現金/匯款/即期支票',
      salesRep: 'Bella',
      items: [
        { id: '1', category: '正面彎軌', name: '100%物理遮光素色布', qty: 66, price: 440 },
        { id: '2', category: '彎軌正面軌道', name: '緹花面無縫布', qty: 66, price: 440 },
        { id: '3', category: '房間', name: '壓花80%遮光布', qty: 12, price: 160 },
        { id: '4', category: '軌道', name: '鋁合金M6手撥軌道', qty: 5, price: 70 },
        { id: '5', category: '高空', name: '高空梯含安裝費用', qty: 1, price: 3500 },
        { id: '6', category: '', name: '免高空費用/同社區介紹', qty: 1, price: -3500 },
      ],
      customDiscountedTotal: 54000,
      salesSignature: 'Bella'
    };

    function App() {
      const [quote, setQuote] = useState(() => {
        const saved = localStorage.getItem('yunduo_current_quote');
        return saved ? JSON.parse(saved) : DEFAULT_QUOTE;
      });

      useEffect(() => {
        localStorage.setItem('yunduo_current_quote', JSON.stringify(quote));
      }, [quote]);

      const calculateSubtotal = () => quote.items.reduce((sum, item) => sum + (Number(item.qty || 0) * Number(item.price || 0)), 0);
      const totalAmount = quote.customDiscountedTotal !== '' ? Number(quote.customDiscountedTotal) : calculateSubtotal();

      const handleItemChange = (id, field, value) => {
        setQuote(prev => ({
          ...prev,
          items: prev.items.map(item => item.id === id ? { ...item, [field]: value } : item)
        }));
      };

      const addItem = () => {
        setQuote(prev => ({
          ...prev,
          items: [...prev.items, { id: Date.now().toString(), category: '', name: '', qty: 1, price: 0 }]
        }));
      };

      const removeItem = (id) => {
        setQuote(prev => ({ ...prev, items: prev.items.filter(item => item.id !== id) }));
      };

      const exportCSV = () => {
        let csvContent = "\uFEFF案名,聯絡電話,地址,報價日期,業務,總金額,50%訂金\n
