<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>畇朵窗飾規劃 雲端報價系統</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @page {
      size: auto;
      margin: 10mm 10mm 10mm 10mm;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; -webkit-print-color-adjust: exact; }
      .print-area { border: none !important; box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 0 !important; }
      .mobile-card-view { display: none !important; }
      .desktop-table-view { display: table !important; }
    }
  </style>
</head>
<body class="bg-stone-100 min-h-screen text-stone-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby85W4jwh67qbZHOifLiRrkYjk96BD2YeUdFv-AXSGgXZWLKH2teiXZxc6eHWsV35jUfw/exec";

    function App() {
      const [sales, setSales] = useState(null);
      const STORAGE_KEY = sales ? `yunduo_quotes_${sales}` : 'yunduo_all_quotes';

      const [quotes, setQuotes] = useState([]);
      const [currentId, setCurrentId] = useState('');
      const [syncing, setSyncing] = useState(false);

      useEffect(() => {
        if (sales) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
        }
      }, [quotes, sales]);

      const selectSales = (salesName) => {
        setSales(salesName);
        const saved = localStorage.getItem(`yunduo_quotes_${salesName}`);
        const initial = saved ? JSON.parse(saved) : [
          {
            id: '1',
            projectName: '新客戶案名',
            phone: '',
            address: '',
            quoteDate: new Date().toLocaleDateString('zh-TW', {year: 'numeric', month: '2-digit', day: '2-digit'}).replace(/\//g, '/'),
            paymentMethod: '現金/匯款/即期支票',
            salesRep: salesName,
            salesPhone: '0978-221-726',
            salesLine: 'bella19941110',
            items: [{ id: Date.now(), floor: '一樓', space: '客廳', name: '遮光布', type: '無縫布', width: 6.5, height: 8.4, qty: 1, price: 360 }],
            customDiscountedTotal: '',
            salesSignature: ''
          }
        ];
        setQuotes(initial);
        setCurrentId(initial[0].id);
      };

      const backToHome = () => {
        setSales(null);
      };

      // 首頁三專案選擇畫面
      if (!sales) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-stone-100 to-amber-50 p-4">
            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-stone-200 space-y-6">
              <div>
                <h1 className="text-2xl md:text-3xl font-bold text-stone-900 tracking-wider">畇朵窗飾規劃</h1>
                <p className="text-xs text-amber-800 tracking-widest mt-1">窗簾選畇朵 空間適得其所</p>
              </div>
              <p className="text-gray-600 text-sm">請點擊選擇您的專案業務區以開始作業：</p>
              
              <div className="space-y-3 pt-2">
                <button 
                  onClick={() => selectSales('Bella')}
                  className="w-full py-3.5 bg-stone-800 text-white font-bold text-lg rounded-xl shadow-md hover:bg-stone-900 transition duration-200 flex items-center justify-center gap-2 active:scale-95"
                >
                  👩‍💼 Bella專案
                </button>
                <button 
                  onClick={() => selectSales('莎莎')}
                  className="w-full py-3.5 bg-stone-700 text-white font-bold text-lg rounded-xl shadow-md hover:bg-stone-800 transition duration-200 flex items-center justify-center gap-2 active:scale-95"
                >
                  👩‍💼 莎莎專案
                </button>
                <button 
                  onClick={() => selectSales('金貴')}
                  className="w-full py-3.5 bg-stone-600 text-white font-bold text-lg rounded-xl shadow-md hover:bg-stone-700 transition duration-200 flex items-center justify-center gap-2 active:scale-95"
                >
                  🧑‍💼 金貴專案
                </button>
              </div>
              <p className="text-xs text-gray-400 pt-2">雲端報價系統 ｜ 手機與平板完美適配</p>
            </div>
          </div>
        );
      }

      const quote = quotes.find(q => q.id === currentId) || quotes[0] || {};

      const updateCurrentQuote = (updatedFields) => {
        setQuotes(quotes.map(q => q.id === currentId ? { ...q, ...updatedFields } : q));
      };

      // 智慧計算單一品項金額
      const calculateItemAmount = (item) => {
        const w = Number(item.width) || 0;
        const h = Number(item.height) || 0;
        const q = Number(item.qty) || 1;
        const p = Number(item.price) || 0;
        const ceilW = Math.ceil(w);
        const ceilH = Math.ceil(h);

        if (item.type === '軌道') {
          return ceilW * p;
        } else if (item.type === '捲簾/百葉類') {
          const cals = Math.max(1, ceilW) * Math.max(1, ceilH);
          return cals * p;
        } else if (item.type === '無縫布' || item.type === '無縫紗') {
          let base = ceilW * 2 * p;
          if (h > 9) base *= 2;
          return base;
        } else if (item.type === '五尺布' || item.type === '五尺紗') {
          const panels = Math.ceil(w / 2.5);
          const heightFactor = ceilH + 1;
          return panels * heightFactor * p;
        } else if (item.type === '電機費用' || item.type === '安裝費用') {
          return q * p;
        } else {
          return ceilW * p;
        }
      };

      const calculateSubtotal = () => (quote.items || []).reduce((sum, item) => sum + calculateItemAmount(item), 0);
      const totalAmount = quote.customDiscountedTotal !== '' && quote.customDiscountedTotal !== undefined ? Number(quote.customDiscountedTotal) : calculateSubtotal();
      const depositAmount = Math.round(totalAmount * 0.5);

      const handleItemChange = (itemId, field, value) => {
        const newItems = quote.items.map(item => item.id === itemId ? { ...item, [field]: value } : item);
        updateCurrentQuote({ items: newItems });
      };

      const addItem = () => {
        const newItems = [...(quote.items || []), { id: Date.now().toString(), floor: '一樓', space: '客廳', name: '新窗簾品項', type: '無縫布', width: 6.5, height: 8.4, qty: 1, price: 360 }];
        updateCurrentQuote({ items: newItems });
      };

      const removeItem = (itemId) => {
        const newItems = quote.items.filter(item => item.id !== itemId);
        updateCurrentQuote({ items: newItems });
      };

      const addNewQuoteFile = () => {
        const newId = Date.now().toString();
        const newFile = {
          id: newId,
          projectName: '新客戶案名',
          phone: '',
          address: '',
          quoteDate: new Date().toLocaleDateString('zh-TW', {year: 'numeric', month: '2-digit', day: '2-digit'}).replace(/\//g, '/'),
          paymentMethod: '現金/匯款/即期支票',
          salesRep: sales,
          salesPhone: '0978-221-726',
          salesLine: 'bella19941110',
          items: [{ id: Date.now() + 1, floor: '一樓', space: '客廳', name: '遮光布', type: '無縫布', width: 6.5, height: 8.4, qty: 1, price: 360 }],
          customDiscountedTotal: '',
          salesSignature: ''
        };
        setQuotes([...quotes, newFile]);
        setCurrentId(newId);
      };

      const deleteCurrentQuote = () => {
        if (quotes.length <= 1) {
          alert('至少需保留一個檔案！');
          return;
        }
        if (confirm(`確定要刪除「${quote.projectName}」的報價單嗎？`)) {
          const remaining = quotes.filter(q => q.id !== currentId);
          setQuotes(remaining);
          setCurrentId(remaining[0].id);
        }
      };

      const exportCSV = () => {
        let csvContent = "\uFEFF案名,聯絡電話,地址,報價日期,業務,總金額,50%訂金\n";
        csvContent += `"${quote.projectName}","${quote.phone}","${quote.address}","${quote.quoteDate}","${quote.salesRep || sales}",${totalAmount},${depositAmount}\n\n`;
        csvContent += "樓層,空間,品名,寬(尺),高(尺),單位,單價,小計\n";
        quote.items.forEach(item => {
          csvContent += `"${item.floor}","${item.space}","${item.name}",${item.width},${item.height},${item.qty},${item.price},${calculateItemAmount(item)}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `畇朵窗飾報價單_${quote.projectName}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const syncToCloud = () => {
        setSyncing(true);
        const payload = {
          projectName: quote.projectName,
          phone: quote.phone,
          address: quote.address,
          quoteDate: quote.quoteDate,
          salesRep: quote.salesRep || sales,
          totalAmount: totalAmount,
          depositAmount: depositAmount
        };

        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(() => {
          setSyncing(false);
          alert(`🎉 成功將「${quote.projectName}」上傳至 Google 雲端總表！`);
        })
        .catch(err => {
          setSyncing(false);
          console.error(err);
          alert("同步時發生錯誤，請稍後重試。");
        });
      };

      const defaultSpaces = ['客廳', '餐廳', '廚房', '主臥', '房間', '書房', '孝親房', '女兒房', '兒子房'];

      return (
        <div className="max-w-4xl mx-auto p-2 sm:p-4 md:p-8">
          {/* 頂部導覽控制區 */}
          <div className="no-print mb-4 bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-stone-200 space-y-3">
            <div className="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <button onClick={backToHome} className="bg-stone-200 text-stone-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-stone-300">
                  🏠 首頁
                </button>
                <span className="text-xs bg-stone-100 text-stone-900 font-bold px-2.5 py-1.5 rounded-lg border border-stone-200">👤 {sales}專區</span>
                <select 
                  value={currentId} 
                  onChange={e => setCurrentId(e.target.value)}
                  className="border border-stone-300 rounded-lg px-2.5 py-1.5 text-sm font-medium bg-stone-50 text-stone-900 focus:outline-none flex-1 sm:flex-none"
                >
                  {quotes.map(q => (
                    <option key={q.id} value={q.id}>{q.projectName} ({q.quoteDate})</option>
                  ))}
                </select>
                <button onClick={addNewQuoteFile} className="bg-stone-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-stone-900 shadow">
                  ＋ 新增案子
                </button>
                <button onClick={deleteCurrentQuote} className="bg-rose-100 text-rose-700 px-2.5 py-1.5 rounded-lg text-sm font-medium hover:bg-rose-200">
                  🗑️
                </button>
              </div>

              <div className="grid grid-cols-3 sm:flex sm:flex-wrap gap-2 pt-1 sm:pt-0">
                <button onClick={syncToCloud} disabled={syncing} className="bg-blue-600 text-white px-3 py-2 rounded-lg font-medium hover:bg-blue-700 shadow text-xs sm:text-sm">
                  {syncing ? '🔄 同步中...' : '☁️ 雲端同步'}
                </button>
                <button onClick={exportCSV} className="bg-emerald-700 text-white px-3 py-2 rounded-lg font-medium hover:bg-emerald-800 shadow text-xs sm:text-sm">
                  📥 匯出 Excel
                </button>
                <button onClick={() => window.print()} className="bg-stone-700 text-white px-3 py-2 rounded-lg font-medium hover:bg-stone-800 shadow text-xs sm:text-sm">
                  🖨️ 列印 / PDF
                </button>
              </div>
            </div>
          </div>

          {/* 報價單 A4 主體 */}
          <div className="print-area bg-white p-6 sm:p-10 rounded-xl shadow-lg border border-stone-200">
            
            {/* 品牌標題區 */}
            <div className="text-center pb-5 mb-6 border-b-2 border-stone-800">
              <h1 className="text-2xl sm:text-3xl font-bold tracking-widest text-stone-900">畇朵窗飾規劃</h1>
              <p className="text-xs sm:text-sm tracking-wider text-amber-800 font-medium mt-1">Cloud Window treatments planning</p>
              <p className="text-xs tracking-widest text-stone-500 mt-1">窗簾選畇朵 ｜ 空間適得其所</p>
            </div>

            {/* 客戶基本資料 */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 mb-6 text-sm bg-stone-50/60 p-4 rounded-lg border border-stone-200/60">
              <div className="space-y-2">
                <p><span className="font-bold text-stone-700">案名：</span>
                  <input value={quote.projectName || ''} onChange={e => updateCurrentQuote({ projectName: e.target.value })} className="no-print border-b px-1 w-40 sm:w-48 font-medium text-stone-900 focus:outline-none focus:border-stone-800 bg-transparent" />
                  <span className="hidden print:inline">{quote.projectName}</span>
                </p>
                <p><span className="font-bold text-stone-700">電話：</span>
                  <input value={quote.phone || ''} onChange={e => updateCurrentQuote({ phone: e.target.value })} className="no-print border-b px-1 w-40 sm:w-48 font-medium text-stone-900 focus:outline-none focus:border-stone-800 bg-transparent" />
                  <span className="hidden print:inline">{quote.phone}</span>
                </p>
                <p><span className="font-bold text-stone-700">地址：</span>
                  <input value={quote.address || ''} onChange={e => updateCurrentQuote({ address: e.target.value })} className="no-print border-b px-1 w-48 sm:w-64 font-medium text-stone-900 focus:outline-none focus:border-stone-800 bg-transparent" />
                  <span className="hidden print:inline">{quote.address}</span>
                </p>
              </div>
              <div className="space-y-2">
                <p><span className="font-bold text-stone-700">日期：</span>
                  <input value={quote.quoteDate || ''} onChange={e => updateCurrentQuote({ quoteDate: e.target.value })} className="no-print border-b px-1 w-32 sm:w-36 font-medium text-stone-900 focus:outline-none focus:border-stone-800 bg-transparent" />
                  <span className="hidden print:inline">{quote.quoteDate}</span>
                </p>
                <p><span className="font-bold text-stone-700">付款：</span>{quote.paymentMethod}</p>
                <p><span className="font-bold text-stone-700">業務：</span>
                  <input value={quote.salesRep || sales} onChange={e => updateCurrentQuote({ salesRep: e.target.value })} className="no-print border-b px-1 w-32 sm:w-36 font-medium text-stone-900 focus:outline-none focus:border-stone-800 bg-transparent" />
                  <span className="hidden print:inline">{quote.salesRep || sales}</span>
                </p>
              </div>
            </div>

            {/* 📱 手機專屬卡片排版 */}
            <div className="block md:hidden space-y-3 mb-3 no-print mobile-card-view">
              {(quote.items || []).map((item, idx) => {
                const isNoWidthHeight = item.type === '電機費用' || item.type === '安裝費用';
                const isTrack = item.type === '軌道';
                const isCustomSpace = !defaultSpaces.includes(item.space);

                return (
                  <div key={item.id} className="bg-stone-50 p-3 rounded-xl border border-stone-300 relative space-y-2">
                    <div className="flex justify-between items-center pb-1 border-b border-stone-200">
                      <span className="font-bold text-stone-900 text-xs">#{idx + 1} 品項</span>
                      <button onClick={() => removeItem(item.id)} className="text-red-500 font-bold px-2 py-0.5 rounded text-xs bg-white border border-red-200">
                        刪除 ✕
                      </button>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div>
                        <label className="text-stone-500 block mb-0.5">樓層</label>
                        <select value={item.floor || '一樓'} onChange={e => handleItemChange(item.id, 'floor', e.target.value)} className="w-full bg-white border border-stone-300 rounded px-1.5 py-1">
                          <option value="無樓層">無樓層</option>
                          <option value="一樓">一樓</option>
                          <option value="二樓">二樓</option>
                          <option value="三樓">三樓</option>
                          <option value="四樓">四樓</option>
                          <option value="五樓">五樓</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-stone-500 block mb-0.5">空間</label>
                        <select 
                          value={isCustomSpace ? 'custom' : (item.space || '客廳')} 
                          onChange={e => handleItemChange(item.id, 'space', e.target.value === 'custom' ? '' : e.target.value)}
                          className="w-full bg-white border border-stone-300 rounded px-1.5 py-1"
                        >
                          {defaultSpaces.map(s => <option key={s} value={s}>{s}</option>)}
                          <option value="custom">✏️ 自訂...</option>
                        </select>
                        {(isCustomSpace || item.space === '') && (
                          <input type="text" value={isCustomSpace ? item.space : ''} onChange={e => handleItemChange(item.id, 'space', e.target.value)} placeholder="輸入空間" className="w-full mt-1 border rounded px-1 bg-white" />
                        )}
                      </div>
                    </div>

                    <div>
                      <label className="text-stone-500 block text-xs mb-0.5">品名與算式</label>
                      <input value={item.name || ''} onChange={e => handleItemChange(item.id, 'name', e.target.value)} placeholder="請輸入品名" className="w-full bg-white border border-stone-300 rounded px-2 py-1 text-sm font-medium mb-1" />
                      <select value={item.type || '無縫布'} onChange={e => handleItemChange(item.id, 'type', e.target.value)} className="w-full bg-stone-200 text-stone-900 font-semibold rounded px-1.5 py-1 text-xs">
                        <option value="無縫布">無縫布/紗 (算式2)</option>
                        <option value="五尺布">五尺布/紗 (算式3)</option>
                        <option value="捲簾/百葉類">捲簾/百葉 (算式1)</option>
                        <option value="軌道">軌道 (僅寬×單價)</option>
                        <option value="電機費用">電機費用 (單位×單價)</option>
                        <option value="安裝費用">安裝費用 (單位×單價)</option>
                      </select>
                    </div>

                    <div className="grid grid-cols-4 gap-1.5 pt-1 text-xs">
                      <div>
                        <label className="text-stone-500 block text-center">寬(尺)</label>
                        {!isNoWidthHeight ? (
                          <input type="number" step="0.1" value={item.width ?? ''} onChange={e => handleItemChange(item.id, 'width', e.target.value)} className="w-full text-center bg-white border rounded py-1" />
                        ) : <div className="text-center py-1 text-stone-300">-</div>}
                      </div>
                      <div>
                        <label className="text-stone-500 block text-center">高(尺)</label>
                        {!isNoWidthHeight && !isTrack ? (
                          <input type="number" step="0.1" value={item.height ?? ''} onChange={e => handleItemChange(item.id, 'height', e.target.value)} className="w-full text-center bg-white border rounded py-1" />
                        ) : <div className="text-center py-1 text-stone-300">-</div>}
                      </div>
                      <div>
                        <label className="text-stone-500 block text-center">單位</label>
                        {isNoWidthHeight ? (
                          <input type="number" value={item.qty ?? 1} onChange={e => handleItemChange(item.id, 'qty', e.target.value)} className="w-full text-center bg-stone-200 border rounded py-1 font-bold" />
                        ) : <div className="text-center py-1 text-stone-300">-</div>}
                      </div>
                      <div>
                        <label className="text-stone-500 block text-center">單價</label>
                        <input type="number" value={item.price ?? ''} onChange={e => handleItemChange(item.id, 'price', e.target.value)} className="w-full text-right bg-white border rounded py-1 px-1" />
                      </div>
                    </div>

                    <div className="text-right pt-1 font-bold text-stone-900 text-sm border-t border-stone-200">
                      小計：${calculateItemAmount(item).toLocaleString()}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* 🖥️ 平板與列印專用表格 */}
            <table className="w-full border-collapse border border-stone-400 mb-2 text-sm hidden md:table desktop-table-view">
              <thead>
                <tr style={{ backgroundColor: '#292524', color: '#f5f5f4' }} className="font-bold">
                  <th className="border border-stone-400 p-2.5 w-20">樓層</th>
                  <th className="border border-stone-400 p-2.5 w-24">空間</th>
                  <th className="border border-stone-400 p-2.5 w-1/4">品名</th>
                  <th className="border border-stone-400 p-2.5 text-center w-14">寬</th>
                  <th className="border border-stone-400 p-2.5 text-center w-14">高</th>
                  <th className="border border-stone-400 p-2.5 text-center w-14">單位</th>
                  <th className="border border-stone-400 p-2.5 text-right w-16">單價</th>
                  <th className="border border-stone-400 p-2.5 text-right">金額</th>
                  <th className="border border-stone-400 p-1 w-10 no-print">動作</th>
                </tr>
              </thead>
              <tbody>
                {(quote.items || []).map((item) => {
                  const isNoWidthHeight = item.type === '電機費用' || item.type === '安裝費用';
                  const isTrack = item.type === '軌道';
                  const isCustomSpace = !defaultSpaces.includes(item.space);

                  return (
                    <tr key={item.id} className="hover:bg-stone-50">
                      <td className="border border-stone-400 p-1.5">
                        <select value={item.floor || '一樓'} onChange={e => handleItemChange(item.id, 'floor', e.target.value)} className="w-full no-print bg-transparent font-medium text-stone-900 focus:outline-none text-xs">
                          <option value="無樓層">無樓層</option>
                          <option value="一樓">一樓</option>
                          <option value="二樓">二樓</option>
                          <option value="三樓">三樓</option>
                          <option value="四樓">四樓</option>
                          <option value="五樓">五樓</option>
                        </select>
                        <span className="hidden print:inline text-xs">{item.floor}</span>
                      </td>

                      <td className="border border-stone-400 p-1.5">
                        <div className="no-print space-y-1">
                          <select value={isCustomSpace ? 'custom' : (item.space || '客廳')} onChange={e => handleItemChange(item.id, 'space', e.target.value === 'custom' ? '' : e.target.value)} className="w-full bg-transparent font-medium text-stone-900 focus:outline-none text-xs">
                            {defaultSpaces.map(s => <option key={s} value={s}>{s}</option>)}
                            <option value="custom">✏️ 自訂...</option>
                          </select>
                          {(isCustomSpace || item.space === '') && (
                            <input type="text" value={isCustomSpace ? item.space : ''} onChange={e => handleItemChange(item.id, 'space', e.target.value)} placeholder="輸入空間" className="w-full text-xs border rounded px-1 bg-white focus:outline-none" />
                          )}
                        </div>
                        <span className="hidden print:inline text-xs">{item.space}</span>
                      </td>

                      <td className="border border-stone-400 p-2">
                        <input value={item.name || ''} onChange={e => handleItemChange(item.id, 'name', e.target.value)} className="w-full no-print bg-transparent focus:outline-none font-medium" placeholder="品名" />
                        <select value={item.type || '無縫布'} onChange={e => handleItemChange(item.id, 'type', e.target.value)} className="w-full no-print bg-stone-100 text-stone-900 rounded px-1 mt-1 font-semibold focus:outline-none text-[11px]">
                          <option value="無縫布">無縫布/紗 (算式2)</option>
                          <option value="五尺布">五尺布/紗 (算式3)</option>
                          <option value="捲簾/百葉類">捲簾/百葉 (算式1)</option>
                          <option value="軌道">軌道 (僅寬×單價)</option>
                          <option value="電機費用">電機費用 (單位×單價)</option>
                          <option value="安裝費用">安裝費用 (單位×單價)</option>
                        </select>
                        <span className="hidden print:inline font-medium">{item.name}</span>
                      </td>

                      <td className="border border-stone-400 p-2 text-center">
                        {!isNoWidthHeight ? (
                          <>
                            <input type="number" step="0.1" value={item.width ?? ''} onChange={e => handleItemChange(item.id, 'width', e.target.value)} className="w-14 text-center no-print bg-transparent focus:outline-none" />
                            <span className="hidden print:inline">{item.width}</span>
                          </>
                        ) : <span className="text-stone-300">-</span>}
                      </td>

                      <td className="border border-stone-400 p-2 text-center">
                        {!isNoWidthHeight && !isTrack ? (
                          <>
                            <input type="number" step="0.1" value={item.height ?? ''} onChange={e => handleItemChange(item.id, 'height', e.target.value)} className="w-14 text-center no-print bg-transparent focus:outline-none" />
                            <span className="hidden print:inline">{item.height}</span>
                          </>
                        ) : <span className="text-stone-300">-</span>}
                      </td>

                      <td className="border border-stone-400 p-2 text-center">
                        {isNoWidthHeight ? (
                          <>
                            <input type="number" value={item.qty ?? 1} onChange={e => handleItemChange(item.id, 'qty', e.target.value)} className="w-14 text-center no-print bg-stone-100 rounded focus:outline-none font-bold" />
                            <span className="hidden print:inline">{item.qty ?? 1}</span>
                          </>
                        ) : <span className="text-stone-300">-</span>}
                      </td>

                      <td className="border border-stone-400 p-2 text-right">
                        <input type="number" value={item.price ?? ''} onChange={e => handleItemChange(item.id, 'price', e.target.value)} className="w-16 text-right no-print bg-transparent focus:outline-none" />
                        <span className="hidden print:inline">{Number(item.price || 0).toLocaleString()}</span>
                      </td>

                      <td className="border border-stone-400 p-2 text-right font-medium">
                        {calculateItemAmount(item).toLocaleString()}
                      </td>

                      <td className="border border-stone-400 p-1 text-center no-print">
                        <button onClick={() => removeItem(item.id)} className="text-red-500 hover:text-red-700 font-bold">✕</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>

            {/* 新增品項按鈕固定在表格正下方 */}
            <div className="no-print mb-6 text-center">
              <button 
                onClick={addItem} 
                className="w-full py-3 bg-stone-800 hover:bg-stone-900 text-white font-bold rounded-xl shadow transition duration-200 text-sm flex items-center justify-center gap-2"
              >
                ➕ 新增品項
              </button>
            </div>

            {/* 金額與條款 */}
            <div className="grid grid-cols-1 md:grid-cols-3 border border-stone-400 text-xs mb-6">
              <div className="md:col-span-2 p-3 border-b md:border-b-0 md:border-r border-stone-400 bg-stone-50 leading-relaxed">
                <p className="font-bold text-sm mb-1 text-stone-900">為確保雙方權益及服務品質，相關合作條款如下：</p>
                <ol className="list-decimal list-inside space-y-1 text-stone-700">
                  <li>付款方式：僅提供現金、匯款或即期支票。</li>
                  <li>收款：訂單確認後，須回簽本報價單並支付訂金 50%，以利安排生產與施工時程，完工收 50%。</li>
                  <li>客製商品說明：本報價單所列項目皆為客製化訂製品，恕不接受退訂或更改。</li>
                  <li>所有權保留：於貨款未全數付清前，產品所有權仍歸本公司所有。</li>
                  <li>報價有效期限制：本報價單自開立日起有效 14 天。</li>
                </ol>
              </div>
              <div className="md:col-span-1 flex flex-col justify-between">
                <div className="flex justify-between p-3 border-b border-stone-400 font-bold bg-stone-200 text-sm text-stone-900">
                  <span>總計：</span>
                  <span>${calculateSubtotal().toLocaleString()}</span>
                </div>
                <div className="p-3 bg-stone-100 h-full flex flex-col justify-center">
                  <div className="flex justify-between items-center mb-1 font-bold text-stone-900 text-sm">
                    <span>優惠價含稅：</span>
                    <input type="number" value={quote.customDiscountedTotal ?? ''} onChange={e => updateCurrentQuote({ customDiscountedTotal: e.target.value })} className="w-24 text-right border border-stone-300 rounded px-1 no-print font-bold text-stone-900 bg-white" />
                    <span className="hidden print:inline">${totalAmount.toLocaleString()}</span>
                  </div>
                  <p className="text-xs font-semibold text-stone-700 text-right mt-2">
                    50% 訂金金額：${depositAmount.toLocaleString()}
                  </p>
                </div>
              </div>
            </div>

            {/* 底部聯絡資訊（可直接修改規劃師姓名、電話、LINE）與簽章區 */}
            <div className="pt-4 border-t-2 border-stone-400 text-sm flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
              <div className="space-y-1 text-stone-700 text-xs sm:text-sm">
                <p className="font-bold text-stone-900 flex items-center gap-1">
                  <span>畇朵窗飾規劃 ｜ 窗飾規劃師：</span>
                  <input 
                    value={quote.salesRep || sales} 
                    onChange={e => updateCurrentQuote({ salesRep: e.target.value })} 
                    className="no-print border-b px-1 w-24 font-bold text-stone-900 bg-transparent focus:outline-none" 
                  />
                  <span className="hidden print:inline">{quote.salesRep || sales}</span>
                </p>
                <p className="flex items-center gap-1">
                  <span>📍 臺南市永康區六合路99號 ｜ 📞 電話：</span>
                  <input 
                    value={quote.salesPhone ?? '0978-221-726'} 
                    onChange={e => updateCurrentQuote({ salesPhone: e.target.value })} 
                    className="no-print border-b px-1 w-32 font-medium text-stone-800 bg-transparent focus:outline-none" 
                  />
                  <span className="hidden print:inline">{quote.salesPhone ?? '0978-221-726'}</span>
                </p>
                <p className="flex items-center gap-1 flex-wrap">
                  <span>💬 LINE：</span>
                  <input 
                    value={quote.salesLine ?? 'bella19941110'} 
                    onChange={e => updateCurrentQuote({ salesLine: e.target.value })} 
                    className="no-print border-b px-1 w-32 font-medium text-stone-800 bg-transparent focus:outline-none" 
                  />
                  <span className="hidden print:inline">{quote.salesLine ?? 'bella19941110'}</span>
                  <span className="ml-1">｜ 🏦 103 新光銀行新營分行 (0541-10-1004306)</span>
                </p>
              </div>

              <div className="flex gap-4 sm:gap-6 text-center text-stone-900 font-bold w-full sm:w-auto justify-between sm:justify-end">
                <div className="border border-stone-300 p-3 sm:p-4 rounded-lg bg-stone-50 flex-1 sm:flex-none min-w-[130px]">
                  <p className="mb-6 sm:mb-8 text-xs text-stone-500 font-normal">公司業務簽章</p>
                  <p className="text-xs sm:text-sm text-stone-300 font-normal">（請在此簽名）</p>
                </div>
                <div className="border border-stone-300 p-3 sm:p-4 rounded-lg bg-stone-50 flex-1 sm:flex-none min-w-[130px]">
                  <p className="mb-6 sm:mb-8 text-xs text-stone-500 font-normal">客戶簽章</p>
                  <p className="text-xs sm:text-sm text-stone-300 font-normal">（請在此簽名）</p>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
